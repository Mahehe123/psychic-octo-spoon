<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8392b">
  <title>Pickleball Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main"></main>
  <nav class="tabs">
    <a href="#/sessions" data-view="sessions" style="--c:var(--wood)"><i>木</i>Sessions</a>
    <a href="#/owed" data-view="owed" style="--c:var(--fire)"><i>火</i>Unpaid</a>
    <a href="#/players" data-view="players" style="--c:var(--earth)"><i>土</i>Players</a>
    <a href="#/backup" data-view="backup" style="--c:var(--water)"><i>水</i>Backup</a>
  </nav>
  <div id="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
